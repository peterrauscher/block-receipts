<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Block Receipts</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <h1>Block Receipts</h1>
      </header>

      <nav class="tabs" aria-label="Sections">
        <button type="button" class="tab is-active" data-tab="receipts">
          <span>Receipts</span>
        </button>
        <button type="button" class="tab" data-tab="settings">
          <span>Settings</span>
        </button>
      </nav>

      <section id="panel-receipts" class="panel">
        <div class="search-wrap">
          <label class="search">
            <span class="vh">Search receipts</span>
            <input id="search" type="search" placeholder="Search receipts" autocomplete="off" />
          </label>
        </div>
        <p id="count" class="count" hidden></p>
        <div id="list" class="list"></div>
        <div id="empty" class="empty" hidden>
          <p class="empty-title">No receipts yet</p>
          <p>Block someone from a post and that post is stored as the reason. Profile blocks can ask you first.</p>
        </div>
      </section>

      <section id="panel-settings" class="panel" hidden>
        <label class="setting">
          <span>
            <strong>Ask on profile blocks</strong>
            <em>Prompt for a reason when you block from a profile.</em>
          </span>
          <input id="promptOnProfileBlock" type="checkbox" />
        </label>
        <label class="setting">
          <span>
            <strong>Show reasons on X</strong>
            <em>Show saved reasons on the blocked accounts page.</em>
          </span>
          <input id="injectOnBlockedPage" type="checkbox" />
        </label>
      </section>
    </div>
    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
